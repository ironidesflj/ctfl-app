name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run bank:build
      - name: Verify generated banks are committed
        run: git diff --exit-code -- src/synapse/data/banks scripts/bank-report.json
      - run: bun run test
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
