    <script>
      /* r8: hrefs de PWA absolutos ANTES de qualquer fetch do browser.
         Deep links servidas pelo shell do SW (ex: /synapse/ctfl/quiz)
         resolvem hrefs relativos CONTRA A ROTA (404) antes do main.jsx
         rodar; este script síncrono reescreve primeiro. %BASE_URL% é
         substituído pelo Vite (dev: "/" · build --base: "/synapse/").
         O absolutizePwaLinks() do boot segue como defesa pós-pushState. */
      (function () {
        var base = "%BASE_URL%";
        var fix = function (rel, file) {
          var el = document.querySelector('link[rel="' + rel + '"]');
          if (el) el.setAttribute("href", base + file);
        };
        fix("manifest", "manifest.webmanifest");
        fix("apple-touch-icon", "icon-192.png");
        var splashes = document.querySelectorAll('link[rel="apple-touch-startup-image"]');
        for (var i = 0; i < splashes.length; i++) {
          var f = (splashes[i].getAttribute("href") || "").split("/").pop();
          if (f) splashes[i].setAttribute("href", base + f);
        }
      })();
    </script>
