<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="syn-title">
  <title id="syn-title">Synapse</title>
  <!-- Dipolo de elipses keplerianas (-39.8° e -22°) cravado nos polos P1(22.5,90) e P4(97.5,27.5) -->
  <g fill="none" stroke="#3b2fb0" stroke-linecap="round">
    <ellipse cx="60" cy="58.75" rx="48.8" ry="19.5" transform="rotate(-39.8 60 58.75)" stroke-width="1.45" opacity="0.34" />
    <ellipse cx="60" cy="58.75" rx="48.8" ry="11.5" transform="rotate(-22 60 58.75)" stroke-width="1.3" opacity="0.22" />
    <ellipse cx="58.75" cy="53.75" rx="34" ry="16" transform="rotate(39.3 58.75 53.75)" stroke-width="1.3" stroke-dasharray="2.5 3.5" opacity="0.28" />
    <!-- Malha da Constelação Sináptica -->
    <path d="M 22.5 90 L 19 52 L 45 42.5 L 64 17 L 97.5 27.5" stroke-width="1.2" opacity="0.42" />
    <path d="M 22.5 90 L 57 96 L 72.5 65 L 102 63 L 97.5 27.5" stroke-width="1.2" opacity="0.42" />
    <path d="M 19 52 L 64 17 M 57 96 L 102 63" stroke-width="1.0" stroke-dasharray="2 3.5" opacity="0.28" />
  </g>
  <!-- Estrelas satélites da constelação -->
  <g>
    <circle cx="19" cy="52" r="2.4" fill="#3b2fb0" opacity="0.65" />
    <circle cx="64" cy="17" r="2.6" fill="#5a4be7" opacity="0.85" />
    <circle cx="36" cy="22" r="1.7" fill="#3b2fb0" opacity="0.45" />
    <circle cx="57" cy="96" r="2.4" fill="#3b2fb0" opacity="0.65" />
    <circle cx="102" cy="63" r="2.6" fill="#5a4be7" opacity="0.85" />
    <circle cx="86" cy="94" r="1.7" fill="#3b2fb0" opacity="0.45" />
  </g>
  <!-- Traço primário da trilha ascendente (P1 -> P2 -> P3 -> P4) -->
  <path d="M 22.5 90 L 45 42.5 L 72.5 65 L 97.5 27.5" fill="none" stroke="#3b2fb0" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 3 nós anelares vazados (P1, P2, P3) -->
  <circle cx="22.5" cy="90" r="4.5" fill="#f6f5f9" stroke="#3b2fb0" stroke-width="3.2" />
  <circle cx="45" cy="42.5" r="4.5" fill="#f6f5f9" stroke="#3b2fb0" stroke-width="3.2" />
  <circle cx="72.5" cy="65" r="4.5" fill="#f6f5f9" stroke="#3b2fb0" stroke-width="3.2" />
  <!-- Estrela-ápice P4 com anel de ressonância -->
  <circle cx="97.5" cy="27.5" r="9.8" fill="none" stroke="#5a4be7" stroke-width="1.25" opacity="0.45" />
  <circle cx="97.5" cy="27.5" r="6.5" fill="#5a4be7" />
</svg>
